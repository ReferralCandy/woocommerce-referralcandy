name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Deploy plugin to SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # readme.txt's Stable tag is what WordPress.org actually serves, so a version that disagrees
      # with the tag either ships the wrong code or ships nothing.
      - name: Verify the version agrees everywhere
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs verify "$RELEASE_TAG"

      - name: Run tests
        run: pnpm test

      - name: Build admin assets
        run: pnpm run build

      - name: Assert build output
        run: test -f build/index.js && test -f build/index.asset.php

      - name: Deploy to WordPress.org Plugin Directory
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: referralcandy-for-woocommerce
          ASSETS_DIR: assets
